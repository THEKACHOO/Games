<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gallery</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#000;color:#fff;font-family:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif}
#phone{position:relative;height:100%;max-width:420px;margin:0 auto;background:#000;border-left:1px solid #1f1f1f;border-right:1px solid #1f1f1f;display:flex;flex-direction:column;overflow:hidden}
button{font-family:inherit;color:inherit}
svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#status{display:flex;justify-content:space-between;align-items:center;padding:10px 22px 4px;font-size:13px;font-weight:600;letter-spacing:.5px}
#bat{width:24px;height:11px;border:1.5px solid #fff;border-radius:3px;position:relative;padding:1px}
#bat::before{content:"";display:block;width:14%;height:100%;background:#fff;border-radius:1px;animation:lb 1.4s infinite}@keyframes lb{50%{opacity:.25}}
#bat::after{content:"";position:absolute;right:-4px;top:2px;width:2px;height:4px;background:#fff;border-radius:0 1px 1px 0}
.title{padding:18px 22px 10px}
.title h2{margin:0;font-size:32px;font-weight:700;letter-spacing:-.5px}
.title .sub{color:#8a8a8a;font-size:13px;letter-spacing:2px;margin-top:4px;text-transform:uppercase}
#grid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:8px 3px;align-content:start}
.cell{aspect-ratio:1/1;background:#111;border:0;padding:0;cursor:pointer;overflow:hidden}
.cell img{width:100%;height:100%;object-fit:cover;display:block}
.cell:active{opacity:.7}
#nav{display:flex;justify-content:space-between;align-items:center;padding:8px 26px 12px}
#nav button{background:none;border:0;padding:8px;cursor:pointer;color:#fff;display:flex}
#nav svg{width:22px;height:22px}
#pill{width:120px;height:5px;border-radius:3px;background:#fff;padding:0!important}

#viewer{position:absolute;inset:0;z-index:10;background:#000;display:none;flex-direction:column}
#viewer.on{display:flex}
#vtop{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 8px}
#vtop button{background:none;border:0;padding:8px;cursor:pointer;display:flex}
#vcount{font-size:14px;letter-spacing:2px;color:#ccc}
#strip{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#strip::-webkit-scrollbar{display:none}
.slide{flex:none;width:100%;height:100%;scroll-snap-align:center;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center}
.slide img{max-width:100%;max-height:100%;object-fit:contain;display:block}
#vbot{height:calc(26px + env(safe-area-inset-bottom,0px))}
</style>
</head>
<body>
<div id="phone">
  <div id="status"><span>00:00</span><div style="display:flex;align-items:center;gap:8px"><span>6%</span><div id="bat"></div></div></div>
  <div class="title"><h2>Gallery</h2><div class="sub">9 photos</div></div>
  <div id="grid"></div>

  <div id="nav">
    <button id="back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button id="pill" aria-label="Home"></button>
    <span style="width:38px"></span>
  </div>

  <div id="viewer">
    <div id="vtop">
      <button id="vclose" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span id="vcount"></span>
      <span style="width:44px"></span>
    </div>
    <div id="strip"></div>
    <div id="vbot"></div>
  </div>
</div>

<script>
const HOME_PAGE="Home.html";
const PHOTOS=[1,2,3,4,5,6,7,8,9].map(n=>"Foto"+n+".jpg");
const $=id=>document.getElementById(id);
const strip=$("strip");
let idx=0;

PHOTOS.forEach((src,i)=>{
  const b=document.createElement("button");b.className="cell";
  const im=document.createElement("img");im.src=src;im.alt="Foto "+(i+1);im.loading="lazy";
  b.appendChild(im);b.onclick=()=>openViewer(i);
  $("grid").appendChild(b);

  const s=document.createElement("div");s.className="slide";
  const f=document.createElement("img");f.src=src;f.alt="Foto "+(i+1);f.draggable=false;
  s.appendChild(f);strip.appendChild(s);
});

function setCount(){$("vcount").textContent=(idx+1)+" / "+PHOTOS.length;}
function openViewer(i){
  idx=i;
  $("viewer").classList.add("on");
  strip.style.scrollBehavior="auto";
  strip.scrollLeft=i*strip.clientWidth;
  setCount();
}
function closeViewer(){$("viewer").classList.remove("on");}
function go(d){
  const n=Math.max(0,Math.min(PHOTOS.length-1,idx+d));
  strip.style.scrollBehavior="smooth";
  strip.scrollLeft=n*strip.clientWidth;
}
strip.addEventListener("scroll",()=>{
  const n=Math.round(strip.scrollLeft/strip.clientWidth);
  if(n!==idx){idx=n;setCount();}
});
$("vclose").onclick=closeViewer;
$("back").onclick=()=>{location.href=HOME_PAGE+"#menu";};
$("pill").onclick=()=>{location.href=HOME_PAGE;};
document.addEventListener("keydown",e=>{
  if(!$("viewer").classList.contains("on")) return;
  if(e.key==="ArrowRight") go(1);
  else if(e.key==="ArrowLeft") go(-1);
  else if(e.key==="Escape") closeViewer();
});
</script>
</body>
</html>
