<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#000;color:#fff;font-family:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif}
#phone{position:relative;height:100%;max-width:420px;margin:0 auto;background:#000;border-left:1px solid #1f1f1f;border-right:1px solid #1f1f1f;display:flex;flex-direction:column;overflow:hidden}
button,input{font-family:inherit;color:inherit}
svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.view{display:none;flex:1;min-height:0;flex-direction:column}
.view.on{display:flex}
#status{display:flex;justify-content:space-between;align-items:center;padding:10px 22px 4px;font-size:13px;font-weight:600;letter-spacing:.5px;position:relative;z-index:2}
#bat{width:24px;height:11px;border:1.5px solid #fff;border-radius:3px;position:relative;padding:1px}
#bat::before{content:"";display:block;width:14%;height:100%;background:#fff;border-radius:1px;animation:lb 1.4s infinite}@keyframes lb{50%{opacity:.25}}
#bat::after{content:"";position:absolute;right:-4px;top:2px;width:2px;height:4px;background:#fff;border-radius:0 1px 1px 0}

#home{
  justify-content:space-between;align-items:center;padding:60px 0 34px;
  background:url(Wallpaper.png) center/cover no-repeat;
  position:relative;
}
#home::before{
  content:"";position:absolute;inset:0;background:rgba(0,0,0,.25);pointer-events:none;
}
#home > *{position:relative;z-index:1}

#clock{font-size:92px;font-weight:100;letter-spacing:-2px;line-height:1;text-align:center;text-shadow:0 2px 18px rgba(0,0,0,.6)}
#date{margin-top:14px;text-align:center;font-size:12px;letter-spacing:3px;text-transform:uppercase;color:#d0d0d0;text-shadow:0 1px 8px rgba(0,0,0,.7)}
#openapps{width:66px;height:66px;border-radius:50%;border:0;background:#fff;color:#000;display:grid;place-items:center;cursor:pointer}
#openapps svg{width:28px;height:28px;stroke-width:2}
#hint{margin-top:12px;font-size:11px;letter-spacing:3px;color:#ddd;text-align:center;text-transform:uppercase;text-shadow:0 1px 6px rgba(0,0,0,.8)}

#apps{
  position:relative;
  background:url(Wallpaper.png) center/cover no-repeat;
}
#apps::before{
  content:"";position:absolute;inset:0;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  z-index:0;
}
#apps > *{position:relative;z-index:1}

#search{margin:14px 20px 6px;padding:12px 18px;border-radius:999px;background:rgba(20,20,20,.75);border:1px solid rgba(255,255,255,.12);color:#bbb;font-size:14px}
#grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:28px 10px;padding:22px 24px 30px;align-content:start}
.app{display:flex;flex-direction:column;align-items:center;gap:9px;background:none;border:0;padding:0;font-size:12px;position:relative;letter-spacing:.3px}
.ic{width:68px;height:68px;border-radius:22px;display:flex;align-items:center;justify-content:center;background:#fff;color:#000}
.app span{color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.app{cursor:pointer}
.app:active .ic{transform:scale(.93)}
.badge{position:absolute;top:-6px;left:calc(50% + 12px);min-width:22px;height:22px;border-radius:11px;background:#000;color:#fff;border:2px solid #fff;font-size:12px;font-weight:700;display:none;align-items:center;justify-content:center;padding:0 5px}

#msgs{background:#000}
.title{display:flex;justify-content:space-between;align-items:center;padding:18px 22px 10px}
.title h2{margin:0;font-size:32px;font-weight:700;letter-spacing:-.5px}
#tlist{flex:1;overflow-y:auto;padding-bottom:10px}
.t{display:flex;gap:14px;padding:13px 22px;cursor:pointer;align-items:center}
.t:active{background:#111}
.av{flex:none;width:48px;height:48px;border-radius:50%;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}
.t .m{flex:1;min-width:0;border-bottom:1px solid #1a1a1a;padding-bottom:13px;margin-bottom:-13px}
.t .n{font-size:16px;font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:center}
.t .n small{font-weight:400;color:#777;font-size:12px;flex:none;text-align:right}
.t .p{color:#8a8a8a;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.t.unread .p{color:#fff;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;background:#fff;flex:none}
#thread{background:#000}
#thead{display:flex;align-items:center;gap:12px;padding:8px 14px 12px;border-bottom:1px solid #1c1c1c;font-size:17px;font-weight:600}
#thead button{background:none;border:0;padding:6px;cursor:pointer;display:flex}
#thead .av{width:36px;height:36px;font-size:15px}
#tbody{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:6px}
.b{max-width:78%;padding:10px 15px;border-radius:20px;font-size:15px;line-height:1.4;word-wrap:break-word}
.b.them{background:#fff;color:#000;align-self:flex-start;border-bottom-left-radius:6px}
.b.me{background:#000;color:#fff;border:1.5px solid #fff;align-self:flex-end;border-bottom-right-radius:6px}
.sys{align-self:center;font-size:12px;letter-spacing:1px;color:#8a8a8a;margin:6px 0}
.st{align-self:flex-end;font-size:11px;color:#8a8a8a;margin:0 6px 6px}
.typing{align-self:flex-start;color:#8a8a8a;font-size:12px;margin-left:6px}
#opts{display:flex;flex-direction:column;align-items:flex-end;gap:8px;padding:10px 16px 18px;min-height:20px}#opts button{padding:11px 20px;border-radius:20px;border-bottom-right-radius:6px;border:1.5px solid #fff;background:#000;color:#fff;font-size:15px;cursor:pointer}#opts button:active{background:#fff;color:#000}
#nav{display:flex;justify-content:space-between;align-items:center;padding:8px 26px 12px}
#nav button{background:none;border:0;padding:8px;cursor:pointer;color:#fff;display:flex}
#nav svg{width:22px;height:22px}
#pill{width:120px;height:5px;border-radius:3px;background:#fff;padding:0!important}
#notif{position:absolute;left:12px;right:12px;top:calc(8px + env(safe-area-inset-top,0px));background:#fff;color:#000;border-radius:20px;padding:12px 16px;z-index:20;transform:translateY(-180%);transition:transform .4s cubic-bezier(.2,.9,.3,1);cursor:pointer}
#notif.on{transform:none}
#notif .h{font-size:11px;letter-spacing:1.5px;color:#666;margin-bottom:5px;display:flex;justify-content:space-between}
#notif .l{font-size:15px;line-height:1.35}
#maps{position:relative;background:#050505;overflow:hidden}
#maps .mapgrid{
  position:absolute;inset:0;overflow:hidden;
  background:
    repeating-linear-gradient(0deg, transparent 0 38px, #1c1c1c 38px 40px),
    repeating-linear-gradient(90deg, transparent 0 38px, #1c1c1c 38px 40px),
    repeating-linear-gradient(0deg, #0a0a0a 0 120px, #0d0d0d 120px 240px),
    repeating-linear-gradient(90deg, #0a0a0a 0 120px, #0d0d0d 120px 240px);
}
#maps .mapgrid::before{
  content:"";position:absolute;inset:-50%;
  background:
    repeating-linear-gradient(45deg, transparent 0 60px, #151515 60px 62px),
    repeating-linear-gradient(-45deg, transparent 0 90px, #131313 90px 92px);
  opacity:.7;
}
#maps .mapgrid::after{
  content:"";position:absolute;top:50%;left:50%;
  width:180px;height:180px;margin:-90px 0 0 -90px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.15);
  box-shadow:0 0 0 40px rgba(255,255,255,.04),0 0 0 80px rgba(255,255,255,.02);
  animation:mpulse 3s ease-in-out infinite;
}
@keyframes mpulse{50%{transform:scale(1.08);opacity:.6}}
#maps .nosignal{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  text-align:center;z-index:2;pointer-events:none;
}
#maps .nosignal .icon{
  width:56px;height:56px;margin:0 auto 12px;
  border-radius:50%;border:2px solid #fff;
  display:grid;place-items:center;opacity:.85;
}
#maps .nosignal .icon svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#maps .nosignal h2{
  margin:0;font-size:22px;font-weight:700;letter-spacing:4px;
  text-transform:uppercase;text-shadow:0 2px 14px #000;
}
#maps .nosignal p{
  margin:8px 0 0;font-size:12px;letter-spacing:2px;color:#aaa;
  text-transform:uppercase;
}
#maps .maptitle{
  position:absolute;top:14px;left:0;right:0;text-align:center;
  font-size:17px;font-weight:600;z-index:2;
}

#cam{position:relative;background:#000 url(Broken.png) center/cover no-repeat;overflow:hidden}
#cam svg{width:26px;height:26px;stroke-width:1.8;filter:drop-shadow(0 1px 4px #000)}
.camtop{display:flex;justify-content:space-between;align-items:center;padding:14px 22px}
.camfoot{margin-top:auto;padding:0 22px 14px}
.modes{display:flex;justify-content:center;gap:26px;font-size:12px;letter-spacing:2px;color:#bbb;margin-bottom:18px;text-shadow:0 1px 6px #000}
.modes .on{color:#fff;font-weight:700}
.shut{display:flex;justify-content:space-between;align-items:center}
.thumb{width:46px;height:46px;border-radius:12px;border:2px solid #fff;background:rgba(0,0,0,.5)}
#shutter{width:72px;height:72px;border-radius:50%;border:4px solid #fff;background:#fff;box-shadow:inset 0 0 0 4px #000;cursor:pointer}
#shutter:active{transform:scale(.92)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5;transition:opacity .35s}
#flash.on{opacity:.9;transition:none}
#cal{background:#000}
#cal h2{margin:0;font-size:32px;font-weight:700;letter-spacing:-.5px}
#cal .sub{color:#8a8a8a;font-size:13px;letter-spacing:2px;margin-top:4px;text-transform:uppercase}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:8px 16px;text-align:center}
.cg div{padding:12px 0;border-radius:12px;font-size:16px;border:1px solid #1f1f1f}
.cg .wd{color:#777;font-size:12px;letter-spacing:1px;border:0;padding:8px 0}
#browser{background:#000}
.bbar{margin:14px 20px;padding:12px 18px;border-radius:999px;background:#141414;border:1px solid #2a2a2a;color:#777;font-size:14px}
.nc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.nc svg{width:56px;height:56px;opacity:.85}
.nc h2{margin:0;font-size:22px;font-weight:700;letter-spacing:3px;text-transform:uppercase}
.nc button{margin-top:6px;padding:11px 28px;border-radius:999px;border:1.5px solid #fff;background:#000;cursor:pointer;font-size:14px;letter-spacing:2px;text-transform:uppercase}
.nc button:active{background:#fff;color:#000}
#over{position:absolute;inset:0;z-index:50;background:#000 url(Monster1.png) center/cover no-repeat;display:none;flex-direction:column;align-items:center;justify-content:space-between;padding:20vh 0 12vh}
#over.on{display:flex}
#over h1{margin:0;font-size:clamp(24px,7vw,32px);font-weight:800;letter-spacing:4px;text-shadow:0 0 14px #000,0 0 4px #000,2px 2px 0 #000;text-align:center}
#revive{padding:14px 44px;border-radius:999px;border:2px solid #fff;background:#000;color:#fff;font-size:17px;letter-spacing:3px;text-transform:uppercase;cursor:pointer}
#revive:active{background:#fff;color:#000}
</style>
</head>
<body>
<div id="phone">
  <div id="status"><span id="stime">00:00</span><div style="display:flex;align-items:center;gap:8px"><span>6%</span><div id="bat"></div></div></div>
  <div id="notif"><div class="h"><span id="nh">MESSAGES</span><span>now</span></div><div class="l" id="nl"></div></div>

  <div class="view on" id="home">
    <div><div id="clock">00:00</div><div id="date"></div></div>
    <div style="display:flex;flex-direction:column;align-items:center">
      <button id="openapps" aria-label="Open menu"><svg viewBox="0 0 24 24"><path d="M6 6h.01M12 6h.01M18 6h.01M6 12h.01M12 12h.01M18 12h.01M6 18h.01M12 18h.01M18 18h.01"/></svg></button>
      <div id="hint">Menu</div>
    </div>
  </div>

  <div class="view" id="apps"><div id="search">Search apps</div><div id="grid"></div></div>

  <div class="view" id="msgs"><div class="title"><h2>Messages</h2></div><div id="tlist"></div></div>

  <div class="view" id="thread">
    <div id="thead"><button id="tback" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><div class="av" id="tav"></div><span id="tname"></span></div>
    <div id="tbody"></div>
    <div id="opts"></div>
  </div>

  <div class="view" id="maps">
    <div class="mapgrid"></div>
    <div class="maptitle">Maps</div>
    <div class="nosignal">
      <div class="icon">
        <svg viewBox="0 0 24 24"><path d="M12 21s7-6 7-11a7 7 0 10-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
      </div>
      <h2>No Signal</h2>
      <p>Location unavailable</p>
    </div>
  </div>

  <div class="view" id="cam">
    <div id="flash"></div>
    <div class="camtop">
      <svg viewBox="0 0 24 24"><path d="M13 2L5 14h6l-1 8 8-12h-6z"/></svg>
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>
    </div>
    <div class="camfoot">
      <div class="modes"><span>VIDEO</span><span class="on">PHOTO</span><span>PORTRAIT</span></div>
      <div class="shut"><div class="thumb"></div><button id="shutter" aria-label="Shutter"></button><svg viewBox="0 0 24 24"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg></div>
    </div>
  </div>

  <div class="view" id="cal">
    <div class="title" style="display:block"><h2>October</h2><div class="sub">Calendar</div></div>
    <div class="cg" id="cgrid"></div>
  </div>

  <div class="view" id="browser">
    <div class="bbar">Search or type URL</div>
    <div class="nc">
      <svg viewBox="0 0 24 24"><path d="M2 8.5a15 15 0 0120 0M5 12a10 10 0 0114 0M8.500 15.500a5 5 0 017 0"/><circle cx="12" cy="19" r=".6"/><path d="M3 3l18 18"/></svg>
      <h2>No connection</h2>
      <button id="retry">Try again</button>
    </div>
  </div>

  <div id="nav">
    <button id="back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button id="pill" aria-label="Home"></button>
    <span style="width:38px"></span>
  </div>

  <div id="over"><h1>GAME OVER</h1><button id="revive">Revive</button></div>

  <audio id="monsterSfx" src="Monster1.mp3" preload="auto"></audio>
  <audio id="sfxNotif" src="Notification.mp3" preload="auto"></audio>
  <audio id="sfxSend" src="Send.mp3" preload="auto"></audio>
  <audio id="woods" src="Woods.mp3" preload="auto" loop></audio>
</div>

<script>
const PHONE_PAGE="Phone.html", GALLERY_PAGE="Gallery.html", NOTES_PAGE="Notes.html";
const MUSIC_PAGE="Music.html", MAPS_PAGE="Maps.html";

/* ===== Alur chat Unknown ===== */
const T=(t,d)=>({f:"them",t,d});
const M=(t,d)=>({f:"me",t,d});
const INTRO=[T("Hey :)",900),T("Let's play with me.")];
const OPTS={
  c1:[{id:"who",t:"Who are you?"},{id:"wait",t:"Wait. What?"}],
  c2:[{id:"trick",t:"Trick"},{id:"threat",t:"Threat"}]
};
const FLOW={
  who:{seq:[M("Who are you?",400),T("Try to guess, maybe?"),T("You can find me with your camera")],next:"end",cam:1},
  wait:{seq:[M("Wait. What?",400),T("Hahaha, you look so cute when you're so clueless"),T("Ok. What day is it today?"),
        M("Today?",1100),M("Halloween?",900),T("Yup. Halloween."),T("So, *Trick or Threat?*"),
        M("Is not Threat, but Treat.",1300),T("No."),T("*Trick or Threat?*")],next:"c2"},
  trick:{seq:[M("Trick",400),{f:"sys",t:"Your camera is on",d:1200}],next:"end",cam:1},
  threat:{seq:[M("Threat",400),T("Hide or run before I find you.")],next:"end",thr:1}
};

const OTHERS=[
  {name:"Lovely Mom", time:"01.31", msgs:["Where are you? Please answer me."]},
  {name:"My Dad",     time:"01.13", msgs:["It's getting late."]},
  {name:"Sissy",      time:"00.40", msgs:["WHERE THE FUCK ARE YOU?!"]},
  {name:"Benny",      time:"00.33", msgs:["Your mom just call me, what happen?"]},
  {name:"Mrs. Diana",  time:"00.13", msgs:["Don't forget to send me the notes, I need it tmr."]},
  {name:"Aunt Rose",  time:"00.10", msgs:["Your mom is worried."]},
  {name:"Sam",        time:"00.06", msgs:["Yo, where are you?"]},
  {name:"Lily",       time:"00.02", msgs:["Did you leave already? All of sudden?"]},
  {name:"Judith",     time:"Yesterday 11.13 PM", msgs:["Send me the photos taken by you, I want to post it~"]},
  {name:"Maya",       time:"Yesterday 10.10 PM", msgs:["Sorry I can't join the party tonight..."]},
];

const APPS=[
  ["Phone","phone",1],["Messages","msg",1],["Contacts","user"],
  ["Browser","globe",1],["Weather","cloud"],["Calendar","cal",1],
  ["Music","note"],["Notes","note2",1],["Maps","pin",1],
  ["Store","bag"],["Gallery","img",1],["Files","folder"],
  ["X","x"],["Calculator","calc"],["Clock","clock"],
  ["Mail","mail"],["Camera","cam",1],["Settings","gear"],
];
const ICONS={
 phone:'<path d="M6 3h3l2 5-2 1.5a11 11 0 006 6l1.500-2 5 2v3a2 2 0 01-2 2A16 16 0 014 5a2 2 0 012-2z"/>',
 msg:'<path d="M4 5h16v11H9l-5 4z"/>',
 img:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M3 17l5-4 4 3 3-3 6 5"/>',
 cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
 globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',
 pin:'<path d="M12 21s7-6 7-11a7 7 0 10-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',
 note:'<path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/>',
 note2:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',
 folder:'<path d="M3 6h7l2 2h9v11H3z"/>',
 cloud:'<path d="M7 18a4 4 0 010-8 5.5 5.500 0 0110.500 1.500A3.300 3.300 0 0117 18z"/>',
 calc:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h2M12 12h2M8 16h2M12 16h2"/>',
 mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
 x:'<path d="M5 5l14 14M19 5L5 19"/>',
 bag:'<path d="M5 8h14l-1 12H6z"/><path d="M9 8a3 3 0 016 0"/>',
};

const $=id=>document.getElementById(id);
const KEY="game_phone_state_v4";
const fresh=()=>({log:[],unread:0,stage:"none",cam:0,thr:0});
let S=fresh();
try{Object.assign(S,JSON.parse(sessionStorage.getItem(KEY)||"{}"));}catch(e){}
const save=()=>{try{sessionStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};
let cur="home", openName=null, busy=false, typing=false, bannerT=null;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const inThread=()=>cur==="thread"&&openName==="Unknown";
function sfx(id){const a=$(id);try{a.currentTime=0;a.play().catch(()=>{});}catch(e){}}

function show(id){
  cur=id;
  const w=$("woods");
  try{
    if(id==="cam"){w.currentTime=0;w.play().catch(()=>{});}
    else w.pause();
  }catch(e){}
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on",v.id===id));
  $("nav").style.display=(id==="home"||id==="thread")?"none":"flex";
}

function tick(){
  $("clock").textContent="00:00";
  $("stime").textContent="00:00";
  $("date").textContent="October 31";
}
tick();

APPS.forEach(([name,ic,live])=>{
  const b=document.createElement("button");b.className="app"+(live?" live":"");
  b.innerHTML='<div class="ic"><svg viewBox="0 0 24 24">'+ICONS[ic]+'</svg></div><span>'+name+'</span>'+(name==="Messages"?'<div class="badge" id="badge"></div>':"");
  if(live) b.onclick=()=>openApp(name);
  $("grid").appendChild(b);
});
function updateBadge(){const b=$("badge");b.style.display=S.unread>0?"flex":"none";b.textContent=S.unread;}
function openApp(n){
  if(n==="Phone") location.href=PHONE_PAGE;
  else if(n==="Gallery") location.href=GALLERY_PAGE;
  else if(n==="Notes") location.href=NOTES_PAGE;
  else if(n==="Music") location.href=MUSIC_PAGE;
  else if(n==="Maps") show("maps");
  else if(n==="Messages"){renderList();show("msgs");}
  else if(n==="Browser") show("browser");
  else if(n==="Calendar") show("cal");
  else if(n==="Camera"){
    if(S.cam&&!busy) gameOver();
    else if(S.thr) show("cam");
  }
}

function allThreads(){
  const L=[];
  const real=S.log.filter(m=>m.f!=="sys");
  if(S.log.length) L.push({name:"Unknown",time:"now",unknown:true,msgs:S.log});
  OTHERS.forEach(o=>L.push({name:o.name,time:o.time,msgs:o.msgs.map(t=>({f:"them",t}))}));
  return L;
}
const plain=s=>s.replace(/\*/g,"");
function rich(el,s){
  s.split("*").forEach((p,i)=>{
    if(!p) return;
    if(i%2){const e=document.createElement("i");e.textContent=p;el.appendChild(e);}
    else el.appendChild(document.createTextNode(p));
  });
}
function renderList(){
  const box=$("tlist");box.innerHTML="";
  allThreads().forEach(t=>{
    const un=t.unknown&&S.unread>0, last=t.msgs[t.msgs.length-1];
    const d=document.createElement("div");d.className="t"+(un?" unread":"");
    d.innerHTML='<div class="av"></div><div class="m"><div class="n"><span></span><small></small></div><div class="p"></div></div>'+(un?'<div class="dot"></div>':'');
    d.querySelector(".av").textContent=t.unknown?"?":t.name[0];
    d.querySelector(".n span").textContent=t.name;
    d.querySelector("small").textContent=t.time;
    d.querySelector(".p").textContent=(last.f==="me"?"You: ":"")+plain(last.t);
    if(t.unknown) d.onclick=()=>openThread(t.name);
    box.appendChild(d);
  });
}
function openThread(name){
  openName=name;
  if(name==="Unknown"&&S.unread>0){S.unread=0;save();updateBadge();}
  $("tname").textContent=name;$("tav").textContent=name==="Unknown"?"?":name[0];
  renderThread();show("thread");
}
function renderThread(){
  const B=$("tbody");B.innerHTML="";
  S.log.forEach(m=>{
    if(m.f==="sys"){const s=document.createElement("div");s.className="sys";s.textContent=m.t;B.appendChild(s);return;}
    const b=document.createElement("div");b.className="b "+m.f;rich(b,m.t);B.appendChild(b);
    if(m.f==="me"){const s=document.createElement("div");s.className="st";s.textContent="Sent";B.appendChild(s);}
  });
  if(typing){const d=document.createElement("div");d.className="typing";d.textContent="typing…";B.appendChild(d);}
  B.scrollTop=B.scrollHeight;renderOpts();
}
function renderOpts(){
  const o=$("opts");o.innerHTML="";
  if(busy||!OPTS[S.stage]) return;
  OPTS[S.stage].forEach(op=>{
    const b=document.createElement("button");b.textContent=op.t;b.onclick=()=>choose(op.id);o.appendChild(b);
  });
}
function refresh(){
  if(cur==="msgs")renderList();
  if(inThread())renderThread();
}

let bannerCam=false;
function banner(text,head){
  bannerCam=!!head;
  $("nh").textContent=head||"MESSAGES";
  $("nl").innerHTML="";
  if(!head){const b=document.createElement("b");b.textContent="Unknown: ";$("nl").appendChild(b);}
  $("nl").appendChild(document.createTextNode(plain(text)));
  $("notif").classList.add("on");clearTimeout(bannerT);
  bannerT=setTimeout(()=>$("notif").classList.remove("on"),2800);
}
function add(m){
  if(m.f!=="sys") S.log.push({f:m.f,t:m.t});
  if(m.f==="me"){sfx("sfxSend");}
  else{
    sfx("sfxNotif");
    if(m.f==="sys") banner(m.t,"SYSTEM");
    else if(!inThread()){S.unread++;banner(m.t);}
  }
  save();updateBadge();refresh();
}
async function run(seq,next,cam,thr){
  if(busy) return;
  busy=true;renderOpts();
  for(const m of seq){
    if(m.f==="them"){typing=inThread();refresh();await sleep(m.d||1400);typing=false;}
    else await sleep(m.d||900);
    add(m);
  }
  if(cam) S.cam=1;
  if(thr) S.thr=1;
  S.stage=next;busy=false;save();refresh();
}
function choose(id){
  const f=FLOW[id];
  S.stage="x";renderOpts();
  run(f.seq,f.next,f.cam,f.thr);
}
function deliver(){
  if(busy||S.stage!=="none") return;
  S.stage="x";
  run(INTRO,"c1");
}
$("notif").onclick=()=>{
  $("notif").classList.remove("on");
  if(bannerCam) gameOver();
  else openThread("Unknown");
};

function gameOver(){
  $("over").classList.add("on");
  const sfx=$("monsterSfx");
  try{ sfx.currentTime=0; sfx.volume=1; sfx.play(); }catch(e){}
}
$("revive").onclick=()=>{
  const sfx=$("monsterSfx");
  try{ sfx.pause(); sfx.currentTime=0; }catch(e){}
  S=fresh();busy=false;typing=false;
  save();updateBadge();
  $("over").classList.remove("on");show("home");
};

$("openapps").onclick=()=>{show("apps");updateBadge();deliver();};
$("pill").onclick=()=>show("home");
$("back").onclick=()=>show(["msgs","maps","cam","cal","browser"].includes(cur)?"apps":"home");

(function(){
  const g=$("cgrid");
  ["S","M","T","W","T","F","S"].forEach(d=>{const e=document.createElement("div");e.className="wd";e.textContent=d;g.appendChild(e);});
  for(let i=0;i<35;i++){const e=document.createElement("div");e.className="d";e.textContent="31";g.appendChild(e);}
})();

$("shutter").onclick=()=>{
  const f=$("flash");f.classList.add("on");
  setTimeout(()=>f.classList.remove("on"),60);
};
$("retry").onclick=()=>{};
$("tback").onclick=()=>{renderList();show("msgs");};

if(S.stage==="x") S.stage=S.log.length>1?"c1":"none"; /* reload di tengah antrean */
updateBadge();
show("home");
</script>
</body>
