<!DOCTYPE html>
<html>
<head>
    <title>Spotify Login Callback</title>
    <style>
        body {
            font-family: system-ui;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #1a1a1a;
            color: white;
        }
        .success {
            text-align: center;
            background: #1DB954;
            padding: 30px;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <div class="success">
        <h2>✅ Login Spotify Berhasil!</h2>
        <p>Redirecting back to app...</p>
    </div>
    <script>
        // Ambil parameter dari URL
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        
        if (code) {
            // Redirect balik ke halaman utama dengan parameter code
            window.location.href = `index.html?code=${code}`;
        } else {
            // Jika tidak ada code, cek error
            const error = urlParams.get('error');
            if (error) {
                alert(`Error: ${error}`);
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
