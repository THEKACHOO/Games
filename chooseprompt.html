<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>CHOOSE PROMPT · VALENTINE</title>
    <style>
        /* RESET DAN VARIABLES – TETAP, HANYA DITAMBAH UTILITAS */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary: #8b0000;
            --secondary: #a52a2a;
            --light: #fff5f5;
            --white: #ffffff;
            --dark: #333333;
            --shadow: 0 10px 30px rgba(139, 0, 0, 0.2);
            --transition: all 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.1);
        }

        /* BASE STYLES – LEBIH FLUID */
        body {
            background: linear-gradient(145deg, var(--light) 0%, var(--white) 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 12px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* HEADER – PROPORSI LEBIH BAGUS DI HP */
        .header {
            margin-bottom: 20px;
            position: relative;
        }

        .header h1 {
            color: var(--primary);
            font-size: 2.4rem;
            margin-bottom: 6px;
            text-shadow: 0 4px 8px rgba(139, 0, 0, 0.12);
            letter-spacing: 2px;
            word-break: break-word;
            font-weight: 800;
            line-height: 1.2;
        }

        .header p {
            color: var(--dark);
            font-size: 1rem;
            opacity: 0.75;
            font-weight: 500;
            padding: 0 8px;
        }

        /* SPINNER CONTAINER – RESPONSIF SEMPURNA */
        .spinner-container {
            position: relative;
            width: min(340px, 75vw);
            height: min(340px, 75vw);
            margin: 0 auto 30px auto;
            aspect-ratio: 1;
        }

        /* SPINNER BASE – ANIMASI PULSE LEBIH HALUS */
        .spinner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(
                from 0deg,
                #8b0000, #a52a2a, #b22222, #c04040,
                #8b0000, #a52a2a, #b22222, #c04040,
                #8b0000, #a52a2a, #b22222, #c04040,
                #8b0000, #a52a2a, #b22222, #c04040,
                #8b0000, #a52a2a, #b22222, #c04040,
                #8b0000, #a52a2a, #b22222, #c04040,
                #8b0000, #a52a2a, #b22222, #c04040
            );
            position: relative;
            transition: transform 0.05s linear;
            box-shadow: 
                0 0 0 12px var(--white),
                0 20px 40px rgba(139, 0, 0, 0.3),
                inset 0 0 25px rgba(255, 255, 255, 0.5);
            overflow: hidden;
            will-change: transform;
        }

        /* ANGKA DI SPINNER – LEBIH BERSIH, ANTI KETIMPA */
        .number {
            position: absolute;
            font-weight: 800;
            font-size: 1.3rem;
            color: var(--white);
            z-index: 6;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
            transform-origin: center;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(10, 10, 10, 0.65);
            backdrop-filter: blur(1.5px);
            border: 2px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.2s;
        }

        /* SPINNER CENTER – EFEK KACA MODERN */
        .spinner-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 86px;
            height: 86px;
            background: var(--white);
            border-radius: 50%;
            z-index: 20;
            box-shadow: 
                0 10px 28px rgba(0, 0, 0, 0.25),
                inset 0 0 16px rgba(139, 0, 0, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            color: var(--primary);
            font-size: 2.8rem;
            border: 5px solid var(--primary);
            pointer-events: none;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            backdrop-filter: blur(2px);
            letter-spacing: 2px;
        }

        .spinner-center.final {
            font-size: 3.2rem;
            color: #8b0000;
            border-color: #8b0000;
            background: #fffafa;
            box-shadow: 
                0 0 40px rgba(139, 0, 0, 0.5),
                inset 0 0 22px rgba(139, 0, 0, 0.3);
        }

        /* SPIN BUTTON – LEBIH ELEGAN DI MOBILE */
        .spin-btn {
            background: var(--primary);
            color: var(--white);
            border: none;
            padding: 18px 40px;
            font-size: 1.3rem;
            border-radius: 60px;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 700;
            margin: 8px auto 25px;
            box-shadow: 0 16px 30px rgba(139, 0, 0, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            letter-spacing: 2px;
            width: fit-content;
            min-width: 240px;
            border: 2px solid rgba(255,255,255,0.3);
            backdrop-filter: blur(2px);
            position: relative;
            overflow: hidden;
        }

        .spin-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -20%;
            width: 140%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 80%);
            opacity: 0;
            transition: opacity 0.4s;
        }

        .spin-btn:hover::after {
            opacity: 0.4;
        }

        .spin-btn:hover {
            background: var(--secondary);
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 24px 45px rgba(139, 0, 0, 0.5);
        }

        .spin-btn:active {
            transform: translateY(2px) scale(0.98);
            box-shadow: 0 10px 25px rgba(139, 0, 0, 0.6);
        }

        .spin-btn:disabled {
            background: #b1a1a1;
            opacity: 0.8;
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 10px 20px rgba(156, 163, 175, 0.3);
            border-color: transparent;
        }

        .spin-btn i {
            font-size: 1.5rem;
            transition: transform 0.5s cubic-bezier(0.2, 0.9, 0.4, 1.2);
        }

        .spin-btn:hover i {
            transform: rotate(200deg) scale(1.1);
        }

        /* PROMPT CONTAINERS – KARTU LEBIH ELEGAN */
        .prompts-container {
            width: 100%;
            max-width: 550px;
            margin-top: 15px;
        }

        .prompt-box {
            background: var(--white);
            border-radius: 28px;
            padding: 28px;
            margin-bottom: 28px;
            border: 2px solid var(--primary);
            box-shadow: 0 20px 35px -8px rgba(139, 0, 0, 0.2);
            display: none;
            text-align: left;
            transition: all 0.4s;
        }

        .prompt-box.active {
            display: block;
            animation: slideInElevated 0.7s cubic-bezier(0.21, 0.98, 0.35, 1.1);
        }

        .prompt-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            padding-bottom: 18px;
            border-bottom: 2px solid rgba(139, 0, 0, 0.15);
        }

        .prompt-number {
            background: var(--primary);
            color: var(--white);
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 800;
            font-size: 1.8rem;
            box-shadow: 0 10px 22px rgba(139, 0, 0, 0.35);
            border: 3px solid var(--white);
            outline: 2px solid var(--primary);
        }

        .prompt-genre-container {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            text-align: right;
        }

        .prompt-genre {
            color: var(--primary);
            font-size: 2rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1.8px;
            line-height: 1.1;
            margin-bottom: 5px;
            text-shadow: 1px 1px 0 rgba(0,0,0,0.05);
        }

        .prompt-author {
            color: #5c4a4a;
            font-size: 0.92rem;
            font-weight: 600;
            font-style: italic;
            padding: 6px 16px;
            background: rgba(139, 0, 0, 0.08);
            border-radius: 40px;
            display: inline-block;
            border: 1px dashed rgba(139,0,0,0.3);
        }

        .prompt-content {
            color: var(--dark);
            font-size: 1.15rem;
            line-height: 1.7;
            padding: 22px;
            background: linear-gradient(145deg, #fffafa, #fff0f0);
            border-radius: 20px;
            border-left: 6px solid var(--primary);
            position: relative;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.02);
            font-weight: 450;
        }

        /* INSTRUCTION – LEBIH FRESH */
        .instruction {
            background: rgba(139, 0, 0, 0.04);
            padding: 20px 22px;
            border-radius: 24px;
            margin-top: 25px;
            color: var(--dark);
            font-size: 1rem;
            border-left: 6px solid var(--primary);
            line-height: 1.7;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(139,0,0,0.2);
            border-left-width: 6px;
        }

        .instruction kbd {
            background: var(--primary);
            color: var(--white);
            padding: 6px 14px;
            border-radius: 40px;
            font-family: 'Segoe UI', monospace;
            font-weight: 700;
            margin: 0 5px;
            border: 1px solid white;
            box-shadow: 0 4px 0 #4a0000;
            font-size: 0.9rem;
        }

        /* FOOTER – PROPORSIONAL */
        .footer {
            margin-top: 45px;
            padding: 25px 10px;
            text-align: center;
            color: #6b5a5a;
            font-size: 0.9rem;
            border-top: 2px solid rgba(139,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }

        .footer p {
            margin: 6px 0;
            line-height: 1.6;
        }

        /* ANIMATIONS – LEBIH KEREN, SMOOTH */
        @keyframes slideInElevated {
            0% {
                opacity: 0;
                transform: translateY(50px) scale(0.92);
                filter: blur(3px);
            }
            60% {
                opacity: 1;
                transform: translateY(-6px) scale(1.02);
                filter: blur(0);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes spinPulseGlow {
            0% {
                box-shadow: 
                    0 0 0 12px var(--white),
                    0 20px 40px rgba(139, 0, 0, 0.3),
                    inset 0 0 25px rgba(255, 255, 255, 0.5);
            }
            70% {
                box-shadow: 
                    0 0 0 16px var(--white),
                    0 25px 55px rgba(139, 0, 0, 0.7),
                    inset 0 0 40px rgba(255, 255, 255, 0.8);
            }
            100% {
                box-shadow: 
                    0 0 0 12px var(--white),
                    0 20px 40px rgba(139, 0, 0, 0.4),
                    inset 0 0 25px rgba(255, 255, 255, 0.6);
            }
        }

        .spinning {
            animation: spinPulseGlow 0.8s infinite alternate ease-in-out;
        }

        @keyframes centerGlowBreath {
            0% {
                box-shadow: 0 0 20px rgba(139, 0, 0, 0.4), inset 0 0 18px rgba(139, 0, 0, 0.2), 0 0 0 6px rgba(139,0,0,0.1);
                transform: translate(-50%, -50%) scale(1);
            }
            100% {
                box-shadow: 0 0 48px rgba(139, 0, 0, 0.7), inset 0 0 32px rgba(139, 0, 0, 0.4), 0 0 0 12px rgba(139,0,0,0.1);
                transform: translate(-50%, -50%) scale(1.06);
            }
        }

        .final-number {
            animation: centerGlowBreath 1.1s infinite alternate cubic-bezier(0.45, 0, 0.55, 1);
        }

        /* RESPONSIVE SUPER DETAIL – MOBILE FIRST MAKSIMAL */
        @media (max-width: 480px) {
            .header h1 {
                font-size: 2rem;
            }

            .spinner-container {
                width: min(300px, 72vw);
                height: min(300px, 72vw);
            }

            .number {
                font-size: 1.1rem;
                width: 32px;
                height: 32px;
                border-width: 1.8px;
                background: rgba(0,0,0,0.7);
            }

            .spinner-center {
                width: 75px;
                height: 75px;
                font-size: 2.4rem;
                border-width: 4px;
            }

            .spinner-center.final {
                font-size: 2.8rem;
            }

            .spin-btn {
                padding: 16px 30px;
                font-size: 1.2rem;
                min-width: 200px;
                gap: 10px;
            }

            .prompt-genre {
                font-size: 1.7rem;
            }

            .prompt-author {
                font-size: 0.8rem;
                padding: 5px 12px;
            }

            .prompt-content {
                font-size: 1rem;
                padding: 20px;
            }

            .prompt-box {
                padding: 22px;
            }

            .instruction {
                padding: 18px;
                font-size: 0.95rem;
            }
        }

        /* LIPATAN ULTRAS KECIL (lipat kecil) */
        @media (max-width: 360px) {
            .spinner-container {
                width: 260px;
                height: 260px;
            }

            .number {
                width: 28px;
                height: 28px;
                font-size: 1rem;
            }

            .spinner-center {
                width: 68px;
                height: 68px;
                font-size: 2.2rem;
            }

            .header h1 {
                font-size: 1.8rem;
            }

            .prompt-genre {
                font-size: 1.5rem;
            }

            .spin-btn {
                padding: 14px 22px;
                font-size: 1.1rem;
            }
        }

        /* TIPOGRAFI LEBIH BAGUS */
        kbd, .spin-btn, .prompt-genre {
            font-synthesis: none;
            font-kerning: normal;
        }

        /* HILANGKAN SCROLL HORIZONTAL */
        html, body {
            max-width: 100vw;
            overflow-x: hidden;
        }

        /* UTILITAS HALUS */
        .spinner, .spin-btn, .prompt-box {
            transition-timing-function: cubic-bezier(0.23, 0.98, 0.32, 1);
        }

        /* GESTURE TAP RESPONSIVE */
        .spin-btn {
            -webkit-tap-highlight-color: transparent;
        }

        /* ANIMASI EXTRA UNTUK ANGKA-ANGKA DI SPINNER */
        @keyframes subtleNumberPop {
            0% { transform: translate(-50%, -50%) scale(1); }
            100% { transform: translate(-50%, -50%) scale(1.06); background: rgba(139,0,0,0.8); }
        }

        /* TIDAK MENGUBAH WARMA, HANYA MENINGKATKAN */
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <h1>CHOOSE PROMPT</h1>
            <p>Putar spinner dan dapatkan prompt menulis edisi Valentine!</p>
        </div>

        <!-- SPINNER DENGAN LAYOUT BERSIH -->
        <div class="spinner-container">
            <div class="spinner" id="spinner">
                <div class="spinner-center" id="centerNumber">?</div>
                <!-- Angka akan diisi JavaScript -->
            </div>
        </div>

        <!-- SPIN BUTTON + IKON LEBIH SMOOTH -->
        <button class="spin-btn" id="spinBtn">
            <i class="fas fa-sync-alt"></i>
            PUTAR SPINNER
        </button>

        <!-- INSTRUCTION DENGAN KEYBOARD -->
        <div class="instruction">
            <strong>✨ Tips:</strong> Klik tombol atau tekan <kbd>␣ SPACE</kbd> untuk memutar. Animasi 10 detik yang dramatis!
        </div>

        <!-- PROMPT CONTAINERS - akan diisi JS -->
        <div class="prompts-container" id="promptsContainer"></div>
    </div>

    <!-- FOOTER -->
    <div class="footer">
        <p>This feature is created by The Kachoo & Prompt Ideas for roleplay purposes.</p>
        <p>© 2026 CHOOSE PROMPT · VALENTINE EDITION</p>
    </div>

    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        // ---------- DATA PROMPT LENGKAP (SAMA PERSIS, TIDAK DIUBAH) ----------
        const prompts = {
            1: { genre: "ROMANCE COMEDY", author: "by Prompt Ideas", prompt: "Ingatan macam apa ini? Semalam, orang yang paling menyebalkan, kau anggap dia sangat membencimu, menyatakan cinta dalam kondisi mabuk? Lebih-lebih, kalian berciuman beberapa kali di malam Valentine!" },
            2: { genre: "DARK ROMANCE", author: "by Prompt Ideas", prompt: "Kau memiliki sahabat yang selalu melindungimu dari orang-orang jahat. Belakangan kau baru sadar bahwa mereka menghilang. 'Aku tidak membunuh mereka,' bisiknya, 'aku hanya menyingkirkan sampah!'" },
            3: { genre: "ROMANCE", author: "by Prompt Ideas", prompt: "Kau melihat-lihat buku tahunan SMA. Tiba-tiba terbesit sebuah ide untuk menghubungi mantan crushmu dulu dimalam Valentine. Sialnya, nomor itu masih aktif!" },
            4: { genre: "ROMANCE COMEDY", author: "by Prompt Ideas", prompt: "Kamu lagi bermain True or Dare, sebagai pemberani kami memilih Dare. Kamu dengan berani berkata, 'Aku bakal ngajak kencan orang pertama yang masuk dari pintu itu!' Tiba-tiba, orang yang paling menyebalkan menunjukkan batang hidungnya di sana. Sialnya, dia setuju untuk berkencan denganmu." },
            5: { genre: "DARK ROMANCE", author: "by Prompt Ideas", prompt: "Dia selalu tahu kemana kamu pergi. Saat kamu menemukan sebuah alat GPS di dalam tasmu, dia hanya tersenyum sambil mengunci pintu. 'Aku begini buat jagain kamu.'" },
            6: { genre: "ROMANCE", author: "by Prompt Ideas", prompt: "Hujan lebat, kau memutuskan untuk menginap di rumah sahabatmu. Kamu memakai bajunya yang kebesaran sebagai piyama. Dia melihatmu, terdiam lama dan berkata, 'Kenapa kamu bisa seimut ini, sih?'" },
            7: { genre: "ROMANCE COMEDY", author: "by Kachoo", prompt: "Sudah banyak sekali teman-temanmu menjodohkanmu dengan sahabat dekatmu, kamu memang ada rasa dengannya, namun kamu tahu pasti kalau sahabatmu sering membicarakan tentang seseorang yang ia sukai. Lalu, di malam Valentine kamu memintanya untuk menyatakan cinta dengan orang yang ia sukai. Katanya, 'Kamu gatau ya kalau orang yang aku maksud, itu kamu.'" },
            8: { genre: "DARK ROMANCE", author: "by Prompt Ideas", prompt: "Setiap kali kamu mencoba mengakhiri hubungan, dia akan menyakiti dirinya sendiri di depanmu. 'Ini semua karena kamu. Kalau kamu mau putus, aku akan mengulangi kisah gelap Valentine dengan melompat dari atas gedung!'" },
            9: { genre: "ROMANCE", author: "by Prompt Ideas", prompt: "Hujan lebat, kau memutuskan untuk menginap di rumah sahabatmu. Kamu memakai bajunya yang kebesaran sebagai piyama. Dia melihatmu, terdiam lama dan berkata, 'Kenapa kamu bisa seimut ini, sih?'" },
            10: { genre: "ROMANCE COMEDY", author: "by Prompt Ideas", prompt: "Kamu pura-pura punya pacar demi menghindari mantan di pesta, lalu menarik orang asing untuk jadi pacar pura-pura. Ternyata dia terlalu pandai berbohong sampai kamu kagum sendiri." },
            11: { genre: "DARK ROMANCE", author: "by Prompt Ideas", prompt: "Dia membuatmu percaya bahwa semua teman-temanmu membencimu, sampai mereka meninggalkanmu. 'Hanya aku yang tulus,' ujarnya berulang kali sampai kau pun percaya." },
            12: { genre: "ROMANCE", author: "by Prompt Ideas", prompt: "Kau kesal karena sahabatmu tidak menanggapi serius saat kau bercerita. Padahal kau baru saja putus cinta. 'Jadi pacarku aja, gimana?' katanya tiba-tiba." },
            13: { genre: "ROMANCE COMEDY", author: "by Prompt Ideas", prompt: "Kamu sedang mencoba diet, tapi kekasihmu sengaja memakan makanan favoritmu di depanmu dengan ekspresi sangat nikmat. Saat kamu hampir menyerah, dia malah menyuapimu sepotong kecil sambil tertawa." },
            14: { genre: "DARK ROMANCE", author: "by Prompt Ideas", prompt: "Dia diam-diam menyabotase setiap hubunganmu, membuat semua pria menjauhimu karena takut. Saat kamu menangis kesepian, dia datang memelukmu. 'Cuma aku yang nggak akan pernah ninggalin kamu.'" },
            15: { genre: "ROMANCE", author: "by Prompt Ideas", prompt: "'Untuk kali ini aja, mau pura-pura berkencan?' Ia menatap matamu selagi kau terdiam. Bukan karena terkejut, tapi karena degup jantungmu yang berdetak lebih kencang sekarang." },
            16: { genre: "ROMANCE COMEDY", author: "by Prompt Ideas", prompt: "'Entah kenapa aku ingin menciummu,' ujar temanmu, kau kira dia sedang bercanda. Katamu, 'Cium aja kalau berani.' Lalu, satu kecupan mendarat di pipimu. 'Sial! Kenapa kau menciummu?' Kamu terkejut dan hampir menamparnya. Tetapi, dia ternyata menatapmu dengan serius, 'Katanya, kalau berciuman di hari Valentine, bisa berjodoh loh! Tertarik memastikan kebenarannya?'" },
            17: { genre: "DARK ROMANCE", author: "by Kachoo", prompt: "Kamu kenal dia dari aplikasi kencan online, namun yang datang penampilannya jauh berbeda. Dia tampan, tetapi berbeda sekali dari yang kamu tahu. Lalu, dia menggunakan cincin di jari manisnya. Katanya, 'Oh... Iya, aku memang sudah menikah, memangnya ada yang salah ya dari itu?'" },
            18: { genre: "ROMANCE", author: "by Prompt Ideas", prompt: "Komplek / kantormu mengadakan pekan olahraga. Hari itu pertandingan sepak bola sedang berlangsung. Nahasnya bola terlempar kencang dan mengenaimu hingga kau tidak sadarkan diri. Saat bangun, crushmu ada di sebelahmu, menunggumu." },

            20: { genre: "DARK ROMANCE", author: "by Kachoo", prompt: "Di malam Valentine, kekasihmu berjanji akan memberitahu satu rahasianya padamu. 'Aku yang membunuh temanmu.' Katanya." },

            25: { genre: "ROMANCE COMEDY", author: "by Kachoo", prompt: "Kamu menulis novel berdasarkan ceritamu dengan mantan pacarmu. Tapi mantanmu membaca novel itu dan mengajukan gugatan, 'kalau gamau digugat, balikan aja sama aku.' akal-akalan GEN Z." }
        };

        // ---------- DOM ELEMEN ----------
        const spinner = document.getElementById('spinner');
        const spinBtn = document.getElementById('spinBtn');
        const centerNumber = document.getElementById('centerNumber');
        const promptsContainer = document.getElementById('promptsContainer');

        let isSpinning = false;
        let currentRotation = 0;
        const totalNumbers = 25;
        const anglePerNumber = 360 / totalNumbers;

        // ---------- INIT SPINNER (ANGKA POSISI PRESISI) ----------
        function initSpinner() {
            const existingNumbers = spinner.querySelectorAll('.number');
            existingNumbers.forEach(num => num.remove());

            for (let i = 1; i <= totalNumbers; i++) {
                const numberEl = document.createElement('div');
                numberEl.className = 'number';
                numberEl.textContent = i;
                numberEl.id = `num${i}`;
                numberEl.dataset.number = i;

                const angle = (i - 1) * anglePerNumber;
                const radius = 140; // cocok untuk ukuran 340px

                const radian = (angle * Math.PI) / 180;
                const x = Math.sin(radian) * radius;
                const y = -Math.cos(radian) * radius;

                numberEl.style.left = `calc(50% + ${x}px)`;
                numberEl.style.top = `calc(50% + ${y}px)`;
                numberEl.style.transform = `translate(-50%, -50%) rotate(${angle}deg)`;

                spinner.appendChild(numberEl);
            }

            // adaptasi radius untuk layar kecil via CSS sudah, namun JS posisi dinamis.
            // atur ulang saat resize? sederhanakan: sudah proporsional
            window.addEventListener('resize', function() {
                if (window.innerWidth < 400) adjustNumberRadius(120);
                else adjustNumberRadius(140);
            });
            function adjustNumberRadius(newRadius) {
                for (let i = 1; i <= totalNumbers; i++) {
                    const el = document.getElementById(`num${i}`);
                    if (!el) continue;
                    const angle = (i - 1) * anglePerNumber;
                    const rad = (angle * Math.PI) / 180;
                    const x = Math.sin(rad) * newRadius;
                    const y = -Math.cos(rad) * newRadius;
                    el.style.left = `calc(50% + ${x}px)`;
                    el.style.top = `calc(50% + ${y}px)`;
                }
            }
            // panggil sekali
            setTimeout(() => { if (window.innerWidth < 400) adjustNumberRadius(120); }, 10);
        }

        // ---------- BUAT PROMPT CARD (STRUKTUR TETAP) ----------
        function createPromptContainers() {
            promptsContainer.innerHTML = '';
            for (let i = 1; i <= totalNumbers; i++) {
                const promptBox = document.createElement('div');
                promptBox.className = 'prompt-box';
                promptBox.id = `prompt-${i}`;
                promptBox.dataset.number = i;

                const data = prompts[i];
                promptBox.innerHTML = `
                    <div class="prompt-header">
                        <div class="prompt-number">${i}</div>
                        <div class="prompt-genre-container">
                            <div class="prompt-genre">${data.genre}</div>
                            <div class="prompt-author">${data.author}</div>
                        </div>
                    </div>
                    <div class="prompt-content">${data.prompt}</div>
                `;
                promptsContainer.appendChild(promptBox);
            }
        }

        // ---------- SPIN UTAMA (10 DETIK, ANIMASI DIPERHALUS) ----------
        function spin() {
            if (isSpinning) return;

            isSpinning = true;
            spinBtn.disabled = true;
            spinner.classList.add('spinning');

            document.querySelectorAll('.prompt-box').forEach(box => {
                box.classList.remove('active');
            });

            centerNumber.textContent = "?";
            centerNumber.classList.remove('final', 'final-number');

            const selectedNumber = Math.floor(Math.random() * totalNumbers) + 1;
            console.log('🎲 Angka valentine:', selectedNumber);

            const targetAngle = (selectedNumber - 1) * anglePerNumber;
            const fastRotations = 360 * 13; // lebih dramatis dikit tapi tetap 10 detik
            const finalRotation = fastRotations - targetAngle;
            const totalRotation = currentRotation + finalRotation;
            currentRotation = totalRotation % 360;

            let startTime = null;
            const totalDuration = 10000;      // 10 detik
            const fastDuration = 7000;        // 7 detik cepat
            const slowDuration = 2000;        // 2 detik lambat
            const stopDuration = 1000;        // 1 detik final

            function easeOutQuart(t) {
                return 1 - Math.pow(1 - t, 4);
            }

            function animateSpinner(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;

                if (elapsed < totalDuration) {
                    if (elapsed < fastDuration) {
                        const progress = elapsed / fastDuration;
                        const currentRot = currentRotation + (finalRotation * progress * 0.87);
                        spinner.style.transform = `rotate(${currentRot}deg)`;
                        centerNumber.textContent = "?";
                    } 
                    else if (elapsed < fastDuration + slowDuration) {
                        const slowProgress = (elapsed - fastDuration) / slowDuration;
                        const eased = easeOutQuart(slowProgress);
                        const startRot = currentRotation + (finalRotation * 0.87);
                        const endRot = currentRotation + finalRotation;
                        const currentRot = startRot + (endRot - startRot) * eased;
                        spinner.style.transform = `rotate(${currentRot}deg)`;

                        // mulai muncul angka di tengah dengan smooth
                        centerNumber.textContent = selectedNumber;
                        centerNumber.classList.add('final');
                    } 
                    else {
                        // fase stop – glow intensif
                        centerNumber.classList.add('final-number');
                        spinner.style.transform = `rotate(${totalRotation}deg)`;
                    }

                    requestAnimationFrame(animateSpinner);
                } else {
                    // FINISH
                    spinner.style.transform = `rotate(${totalRotation}deg)`;
                    spinner.classList.remove('spinning');
                    centerNumber.textContent = selectedNumber;
                    centerNumber.classList.add('final', 'final-number');

                    setTimeout(() => {
                        showPrompt(selectedNumber);
                    }, 280);

                    setTimeout(() => {
                        spinBtn.disabled = false;
                        isSpinning = false;
                    }, 1000);
                }
            }

            requestAnimationFrame(animateSpinner);
        }

        function showPrompt(number) {
            document.querySelectorAll('.prompt-box').forEach(box => box.classList.remove('active'));
            const promptBox = document.getElementById(`prompt-${number}`);
            if (promptBox) {
                promptBox.classList.add('active');
                setTimeout(() => {
                    promptBox.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 350);
            }
        }

        // ---------- EVENT ----------
        spinBtn.addEventListener('click', spin);
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !isSpinning) {
                e.preventDefault();
                spin();
            }
        });

        // ---------- START ----------
        document.addEventListener('DOMContentLoaded', () => {
            initSpinner();
            createPromptContainers();
            // tampilkan prompt default nomor 1? agar tidak kosong -> biarkan kosong (tidak active) lebih minimalis
            // jika ingin contoh aktif: 
            // setTimeout(() => { showPrompt(1); }, 100);
        });
    </script>
