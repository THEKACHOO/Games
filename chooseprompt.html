<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHOOSE PROMPT</title>
    <style>
        /* RESET DAN VARIABLES */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary: #8b0000;
            --secondary: #a52a2a;
            --light: #fff5f5;
            --white: #ffffff;
            --dark: #333333;
            --shadow: 0 10px 30px rgba(139, 0, 0, 0.2);
            --transition: all 0.3s ease;
        }

        /* BASE STYLES */
        body {
            background: linear-gradient(135deg, var(--light) 0%, var(--white) 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
            flex: 1;
        }

        /* HEADER */
        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            color: var(--primary);
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            letter-spacing: 2px;
        }

        .header p {
            color: var(--dark);
            font-size: 1.1rem;
            opacity: 0.8;
        }

        /* SPINNER CONTAINER */
        .spinner-container {
            position: relative;
            width: 350px;
            height: 350px;
            margin: 0 auto 40px;
        }

        /* SPINNER BASE */
        .spinner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(
                from 0deg,
                #8b0000, #a52a2a, #b22222, #c04040,
                #8b0000, #a52a2a, #b22222, #c04040,
                #8b0000, #a52a2a, #b22222, #c04040,
                #8b0000, #a52a2a, #b22222, #c04040,
                #8b0000, #a52a2a, #b22222, #c04040,
                #8b0000, #a52a2a, #b22222, #c04040,
                #8b0000, #a52a2a, #b22222, #c04040
            );
            position: relative;
            transition: transform 0.05s linear;
            box-shadow: 
                0 0 0 15px var(--white),
                0 20px 40px rgba(139, 0, 0, 0.4),
                inset 0 0 30px rgba(255, 255, 255, 0.4);
            overflow: hidden;
        }

        /* SPINNER NUMBERS - ANGKA DI SPINNER */
        .number {
            position: absolute;
            font-weight: bold;
            font-size: 1.4rem;
            color: var(--white);
            z-index: 2;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.5);
            transform-origin: center;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid var(--white);
        }

        /* SPINNER CENTER - TETAP DI TENGAH TIDAK IKUT BERPUTAR */
        .spinner-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            background: var(--white);
            border-radius: 50%;
            z-index: 10;
            box-shadow: 
                0 0 25px rgba(0, 0, 0, 0.4),
                inset 0 0 20px rgba(139, 0, 0, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            color: var(--primary);
            font-size: 3rem;
            border: 8px solid var(--primary);
            pointer-events: none;
            transition: all 0.5s ease;
        }

        .spinner-center.final {
            font-size: 3.5rem;
            color: #8b0000;
            border-color: #8b0000;
            box-shadow: 
                0 0 35px rgba(139, 0, 0, 0.6),
                inset 0 0 25px rgba(139, 0, 0, 0.3);
        }

        /* SPIN BUTTON */
        .spin-btn {
            background: var(--primary);
            color: var(--white);
            border: none;
            padding: 20px 60px;
            font-size: 1.4rem;
            border-radius: 50px;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 700;
            margin-bottom: 30px;
            box-shadow: 0 15px 30px rgba(139, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 0 auto 30px;
            letter-spacing: 1.5px;
        }

        .spin-btn:hover {
            background: var(--secondary);
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(139, 0, 0, 0.6);
        }

        .spin-btn:active {
            transform: translateY(-2px);
        }

        .spin-btn:disabled {
            background: #cccccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 5px 15px rgba(156, 163, 175, 0.4);
        }

        .spin-btn i {
            font-size: 1.6rem;
            transition: transform 0.3s;
        }

        .spin-btn:hover i {
            transform: rotate(180deg);
        }

        /* PROMPT CONTAINERS */
        .prompts-container {
            width: 100%;
            max-width: 550px;
            margin-top: 20px;
        }

        .prompt-box {
            background: var(--white);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 25px;
            border: 3px solid var(--primary);
            box-shadow: 0 15px 30px rgba(139, 0, 0, 0.15);
            display: none;
            text-align: left;
        }

        .prompt-box.active {
            display: block;
            animation: slideIn 0.6s ease;
        }

        .prompt-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 3px solid var(--light);
        }

        .prompt-number {
            background: var(--primary);
            color: var(--white);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 1.6rem;
            box-shadow: 0 8px 20px rgba(139, 0, 0, 0.4);
        }

        .prompt-genre {
            color: var(--primary);
            font-size: 2.2rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .prompt-content {
            color: var(--dark);
            font-size: 1.2rem;
            line-height: 1.8;
            padding: 25px;
            background: var(--light);
            border-radius: 15px;
            border-left: 6px solid var(--primary);
        }

        /* INSTRUCTION */
        .instruction {
            background: var(--light);
            padding: 20px;
            border-radius: 12px;
            margin-top: 30px;
            color: var(--dark);
            font-size: 1.1rem;
            border-left: 5px solid var(--primary);
            line-height: 1.7;
        }

        .instruction kbd {
            background: var(--primary);
            color: var(--white);
            padding: 4px 10px;
            border-radius: 5px;
            font-family: monospace;
            font-weight: bold;
            margin: 0 4px;
        }

        /* FOOTER */
        .footer {
            margin-top: 50px;
            padding: 25px;
            text-align: center;
            color: #666;
            font-size: 1rem;
            border-top: 2px solid #eee;
            width: 100%;
            max-width: 500px;
        }

        .footer p {
            margin: 8px 0;
            line-height: 1.6;
        }

        /* ANIMATIONS */
        @keyframes slideIn {
            from { 
                opacity: 0; 
                transform: translateY(40px) scale(0.95); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0) scale(1); 
            }
        }

        @keyframes spinPulse {
            0%, 100% { 
                box-shadow: 
                    0 0 0 15px var(--white),
                    0 20px 40px rgba(139, 0, 0, 0.4),
                    inset 0 0 30px rgba(255, 255, 255, 0.4);
            }
            50% { 
                box-shadow: 
                    0 0 0 15px var(--white),
                    0 20px 50px rgba(139, 0, 0, 0.8),
                    inset 0 0 30px rgba(255, 255, 255, 0.6);
            }
        }

        .spinning {
            animation: spinPulse 0.4s infinite alternate;
        }

        @keyframes numberGlow {
            0%, 100% { 
                transform: translate(-50%, -50%) scale(1);
                box-shadow: 0 0 25px rgba(0, 0, 0, 0.4),
                           inset 0 0 20px rgba(139, 0, 0, 0.2),
                           0 0 0 8px var(--primary);
            }
            50% { 
                transform: translate(-50%, -50%) scale(1.05);
                box-shadow: 0 0 35px rgba(139, 0, 0, 0.6),
                           inset 0 0 25px rgba(139, 0, 0, 0.3),
                           0 0 0 8px var(--primary);
            }
        }

        .final-number {
            animation: numberGlow 1s infinite alternate;
        }

        /* RESPONSIVE */
        @media (max-width: 600px) {
            .spinner-container {
                width: 300px;
                height: 300px;
            }
            
            .number {
                font-size: 1.2rem;
                width: 30px;
                height: 30px;
            }
            
            .header h1 {
                font-size: 2.2rem;
            }
            
            .prompt-genre {
                font-size: 1.8rem;
            }
            
            .prompt-content {
                font-size: 1.1rem;
            }
            
            .spin-btn {
                padding: 18px 45px;
                font-size: 1.3rem;
            }
            
            .spinner-center {
                width: 85px;
                height: 85px;
                font-size: 2.5rem;
            }
            
            .prompt-box {
                padding: 25px;
            }
        }
    </style>
</head>
<body>

            7: {

            },
            8: {

            },
            9: {
                genre: "ROMANCE by Prompt Ideas",
                prompt: "Hujan lebat, kau memutuskan untuk menginap di rumah sahabatmu. Kamu memakai bajunya yang kebesaran sebagai piyama. Dia melihatmu, terdiam lama dan berkata, ‘Kenapa kamu bisa seimut ini, sih?’"

                prompt: "Kamu sedang mencoba diet, tapi kekasihmu sengaja memakan makanan favoritmu di depanmu dengan ekspresi sangat nikmat. Saat kamu hampir menyerah, dia malah menyuapimu sepotong kecil sambil tertawa."

            },
            24: {
                genre: "ROMANCE by Kachoo",
                prompt: "Tanpa sengaja, ponselmu tertukar dengan seseorang di bandara. Untunglah dia berada di pesawat yang sama denganmu, 'Ponselnya tertukar, padahal seharusnya nomor kita saja yang tertukar.' katanya."
            },
            25: {
                genre: "ROMANCE COMEDY by Kachoo",
                prompt: "Kamu menulis novel berdasarkan ceritamu dengan mantan pacarmu. Tapi mantanmu membaca novel itu dan mengajukan gugatan, 'kalau gamau digugat, balikan aja sama aku.' akal-akalan GEN Z."

        // ELEMEN DOM
        const spinner = document.getElementById('spinner');
        const spinBtn = document.getElementById('spinBtn');
        const centerNumber = document.getElementById('centerNumber');
        const promptsContainer = document.getElementById('promptsContainer');
        
        // VARIABEL KONTROL
        let isSpinning = false;
        let currentRotation = 0;
        const totalNumbers = 25;
        const anglePerNumber = 360 / totalNumbers;
        
        // INISIALISASI SPINNER DENGAN ANGKA DI SPINNER
        function initSpinner() {
            // Hapus semua angka yang ada
            const existingNumbers = spinner.querySelectorAll('.number');
            existingNumbers.forEach(num => num.remove());
            
            // Tambahkan angka 1-25 di sekeliling spinner
            for (let i = 1; i <= totalNumbers; i++) {
                const numberEl = document.createElement('div');
                numberEl.className = 'number';
                numberEl.textContent = i;
                numberEl.id = `num${i}`;
                numberEl.dataset.number = i;
                
                // Hitung posisi angka di lingkaran
                const angle = (i - 1) * anglePerNumber;
                const radius = 140;
                
                // Konversi ke radian
                const radian = (angle * Math.PI) / 180;
                
                // Hitung posisi X dan Y
                const x = Math.sin(radian) * radius;
                const y = -Math.cos(radian) * radius;
                
                // Atur posisi angka
                numberEl.style.left = `calc(50% + ${x}px)`;
                numberEl.style.top = `calc(50% + ${y}px)`;
                
                // Rotasi angka agar tetap tegak
                numberEl.style.transform = `translate(-50%, -50%) rotate(${angle}deg)`;
                
                spinner.appendChild(numberEl);
            }
            
            console.log('Spinner diinisialisasi dengan', totalNumbers, 'angka');
        }
        
        // BUAT PROMPT CONTAINERS
        function createPromptContainers() {
            promptsContainer.innerHTML = '';
            
            for (let i = 1; i <= totalNumbers; i++) {
                const promptBox = document.createElement('div');
                promptBox.className = 'prompt-box';
                promptBox.id = `prompt-${i}`;
                promptBox.dataset.number = i;
                
                const data = prompts[i];
                
                promptBox.innerHTML = `
                    <div class="prompt-header">
                        <div class="prompt-number">${i}</div>
                        <div class="prompt-genre">${data.genre}</div>
                    </div>
                    <div class="prompt-content">${data.prompt}</div>
                `;
                
                promptsContainer.appendChild(promptBox);
            }
        }
        
        // FUNGSI PUTAR SPINNER - DIPERBAIKI: 10 DETIK SAJA
        function spin() {
            if (isSpinning) return;
            
            isSpinning = true;
            spinBtn.disabled = true;
            spinner.classList.add('spinning');
            
            // Sembunyikan semua prompt
            document.querySelectorAll('.prompt-box').forEach(box => {
                box.classList.remove('active');
            });
            
            // Reset angka di tengah
            centerNumber.textContent = "?";
            centerNumber.classList.remove('final');
            centerNumber.classList.remove('final-number');
            
            // Pilih angka random (1-25)
            const selectedNumber = Math.floor(Math.random() * totalNumbers) + 1;
            console.log('Angka terpilih:', selectedNumber);
            
            // Hitung sudut target
            const targetAngle = (selectedNumber - 1) * anglePerNumber;
            
            // 10 DETIK TOTAL: 7 detik cepat + 2 detik lambat + 1 detik berhenti
            const fastRotations = 360 * 12; // 12 putaran penuh untuk 7 detik
            const finalRotation = fastRotations - targetAngle;
            
            // Total rotasi dari posisi awal
            const totalRotation = currentRotation + finalRotation;
            
            // Simpan rotasi saat ini
            currentRotation = totalRotation % 360;
            
            // VARIABEL ANIMASI
            let startTime = null;
            const totalDuration = 10000;  // 10 detik total
            const fastDuration = 7000;    // 7 detik putaran cepat
            const slowDuration = 2000;    // 2 detik melambat
            const stopDuration = 1000;    // 1 detik berhenti
            
            // Easing function untuk efek melambat
            function easeOutQuart(t) {
                return 1 - Math.pow(1 - t, 4);
            }
            
            // Fungsi animasi
            function animateSpinner(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;
                
                if (elapsed < totalDuration) {
                    // FASE 1: PUTARAN CEPAT (0 - 7000ms)
                    if (elapsed < fastDuration) {
                        // Putaran cepat dengan percepatan konstan
                        const progress = elapsed / fastDuration;
                        const currentRot = currentRotation + (finalRotation * progress * 0.9); // Hanya 90% rotasi di fase cepat
                        spinner.style.transform = `rotate(${currentRot}deg)`;
                        centerNumber.textContent = "?";
                    } 
                    // FASE 2: MELAMBAT (7000 - 9000ms)
                    else if (elapsed < fastDuration + slowDuration) {
                        // Hitung progress fase melambat (0-1)
                        const slowProgress = (elapsed - fastDuration) / slowDuration;
                        const easedProgress = easeOutQuart(slowProgress);
                        
                        // Rotasi dari 90% ke 100%
                        const startRot = currentRotation + (finalRotation * 0.9);
                        const endRot = currentRotation + finalRotation;
                        const currentRot = startRot + ((endRot - startRot) * easedProgress);
                        
                        spinner.style.transform = `rotate(${currentRot}deg)`;
                        
                        // Tampilkan angka di tengah saat mulai melambat
                        centerNumber.textContent = selectedNumber;
                        centerNumber.classList.add('final');
                    }
                    // FASE 3: BERHENTI (9000 - 10000ms)
                    else {
                        // Spinner sudah berhenti, angka tetap ditampilkan dengan efek glow
                        centerNumber.classList.add('final-number');
                    }
                    
                    requestAnimationFrame(animateSpinner);
                } else {
                    // Setelah animasi selesai
                    spinner.style.transform = `rotate(${totalRotation}deg)`;
                    spinner.classList.remove('spinning');
                    
                    // Tampilkan prompt
                    setTimeout(() => {
                        showPrompt(selectedNumber);
                    }, 300);
                    
                    // Reset state
                    setTimeout(() => {
                        spinBtn.disabled = false;
                        isSpinning = false;
                    }, 1000);
                }
            }
            
            // Mulai animasi
            requestAnimationFrame(animateSpinner);
        }
        
        // TAMPILKAN PROMPT BERDASARKAN ANGKA
        function showPrompt(number) {
            // Sembunyikan semua prompt
            document.querySelectorAll('.prompt-box').forEach(box => {
                box.classList.remove('active');
            });
            
            // Tampilkan prompt yang sesuai
            const promptBox = document.getElementById(`prompt-${number}`);
            if (promptBox) {
                promptBox.classList.add('active');
                
                // Scroll ke prompt
                setTimeout(() => {
                    promptBox.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                }, 500);
            }
        }
        
        // EVENT LISTENER
        spinBtn.addEventListener('click', spin);
        
        // Shortcut keyboard: Spasi untuk spin
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !isSpinning) {
                e.preventDefault();
                spin();
            }
        });
        
        // INISIALISASI
        document.addEventListener('DOMContentLoaded', () => {
            initSpinner();
            createPromptContainers();
            
            console.log('CHOOSE PROMPT siap digunakan!');
            console.log('Durasi: 7 detik cepat + 2 detik lambat + 1 detik berhenti = 10 detik total');
            console.log('Tekan tombol "PUTAR SPINNER" atau SPACE untuk memutar.');
        });
    </script>
</body>
