<!DOCTYPE html>
<html lang="id">
<head>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Outfit', sans-serif;
            background: #f0f0f0;
            color: #1a1a1a;
            line-height: 1.4;
        }
        
        .surface {
            background: #ffffff;
            border: 1px solid #cccccc;
            color: #1a1a1a;
        }
        
        input.surface, select.surface {
            background: #ffffff;
            border: 1px solid #cccccc;

        }
        
        input.surface:focus {
            border-color: #888888;

        }
        
        button {
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            background: #1a1a1a;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.9rem;
        }
        
        button.primary {
            background: #1a1a1a;
            color: #ffffff;
        }
        
        button.primary:hover {
            background: #333333;
            transform: scale(0.98);
        }
        
        button:active {
            transform: scale(0.96);
        }
        
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            color: inherit;
        }
        
        header h1, header h2 {
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        
        .lyrics-image-screen {
            max-width: 700px;
            margin: 0 auto;
            padding: 24px 20px 40px;
        }
        
        .screen-wrapper {
            background: #ffffff;
            border-radius: 36px;
            padding: 28px 24px;
            box-shadow: 0 0 0 1px #e0e0e0, 0 8px 20px rgba(0,0,0,0.05);

        header {

            justify-content: space-between;
            margin-bottom: 32px;
            flex-wrap: wrap;
            gap: 12px;
        }
        
        .go-to-screen, #last-go-back, #download {
            background: #e8e8e8;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: inline-flex;

        .go-to-screen:hover, #last-go-back:hover, #download:hover {

        .switch {
            width: 44px;
            height: 24px;
            background: #cccccc;
            border-radius: 40px;

            transition: 0.2s;
        }
        
        .switch::after {
            content: "";
            width: 20px;
            height: 20px;
            background: #ffffff;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 3px;

            font-size: 0.85rem;

        }

        button, .select-song, .line-item, .fab, .go-to-screen {

            margin-right: 8px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

    <script>
        // ========== SPOTIFY INTEGRATION ==========
        // Langkah menghubungkan ke Spotify API:
        // 1. Daftar di https://developer.spotify.com/dashboard
        // 2. Buat aplikasi baru, dapatkan Client ID
        // 3. Ganti CLIENT_ID di bawah dengan Client ID Anda
        // 4. Pada aplikasi Spotify, tambahkan http://localhost/callback ke Redirect URIs untuk testing lokal
        // 5. Untuk production, deploy ke HTTPS dan update Redirect URI
        
        const CLIENT_ID = '8c5c96c528c449fab9a7b9d71d2d8798'; // GANTI DENGAN CLIENT ID ANDA!
        const REDIRECT_URI = window.location.origin + '/callback.html'; // Sesuaikan dengan URL Anda
        
        let currentSongData = null;
        let selectedLines = [];
        let allLyricsArray = [];
        let spotifyAccessToken = null;
        
        // Helper: Get Spotify Access Token (PKCE flow simplified)
        async function getSpotifyToken() {
            // Cek apakah ada token di localStorage
            const token = localStorage.getItem('spotify_token');
            const expiry = localStorage.getItem('spotify_token_expiry');
            if(token && expiry && Date.now() < parseInt(expiry)) {
                return token;
            }
            
            // Redirect ke auth jika tidak ada
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');
            if(code) {
                // Tukar code dengan token
                const verifier = localStorage.getItem('code_verifier');
                const response = await fetch('https://accounts.spotify.com/api/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({
                        client_id: CLIENT_ID,
                        grant_type: 'authorization_code',
                        code: code,
                        redirect_uri: REDIRECT_URI,
                        code_verifier: verifier || ''
                    })
                });
                const data = await response.json();
                if(data.access_token) {
                    localStorage.setItem('spotify_token', data.access_token);
                    localStorage.setItem('spotify_token_expiry', Date.now() + (data.expires_in * 1000));
                    window.history.pushState({}, document.title, window.location.pathname);
                    return data.access_token;
                }
            } else {
                // Generate code verifier & challenge
                const generateRandomString = (length) => {
                    const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
                    const values = crypto.getRandomValues(new Uint8Array(length));
                    return Array.from(values).map(x => possible[x % possible.length]).join('');
                };
                const codeVerifier = generateRandomString(64);
                localStorage.setItem('code_verifier', codeVerifier);
                
                const sha256 = async (plain) => {
                    const encoder = new TextEncoder();
                    const data = encoder.encode(plain);
                    const hash = await crypto.subtle.digest('SHA-256', data);
                    return btoa(String.fromCharCode(...new Uint8Array(hash)))
                        .replace(/=/g, '')
                        .replace(/\+/g, '-')
                        .replace(/\//g, '_');
                };
                const codeChallenge = await sha256(codeVerifier);
                
                const authUrl = 'https://accounts.spotify.com/authorize?' + new URLSearchParams({
                    client_id: CLIENT_ID,
                    response_type: 'code',
                    redirect_uri: REDIRECT_URI,
                    code_challenge_method: 'S256',
                    code_challenge: codeChallenge,
                    scope: 'user-read-private'
                });
                window.location.href = authUrl;
            }
            return null;
        }
        
        // Search tracks via Spotify API
        async function searchSpotifyTracks(query) {
            if(!CLIENT_ID || CLIENT_ID === '8c5c96c528c449fab9a7b9d71d2d8798') {
                throw new Error('Spotify Client ID not configured. Please follow the setup guide in code comments.');
            }
            let token = await getSpotifyToken();
            if(!token) return [];
            
            const response = await fetch(`https://api.spotify.com/v1/search?q=${encodeURIComponent(query)}&type=track&limit=20`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if(!response.ok) throw new Error('Spotify API error');
            const data = await response.json();
            if(!data.tracks || !data.tracks.items) return [];
            
            return data.tracks.items.map(track => ({
                name: track.name,
                artist: track.artists.map(a => a.name).join(', '),
                cover: track.album.images[0]?.url || 'https://placehold.co/600x600?text=No+Cover',
                spotifyId: track.id,
                album: track.album.name
            }));
        }
        
        // Fetch track by ID (for link paste)
        async function getSpotifyTrackById(trackId) {
            let token = await getSpotifyToken();
            if(!token) return null;
            const response = await fetch(`https://api.spotify.com/v1/tracks/${trackId}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if(!response.ok) return null;
            const track = await response.json();
            return {
                name: track.name,
                artist: track.artists.map(a => a.name).join(', '),
                cover: track.album.images[0]?.url || 'https://placehold.co/600x600?text=No+Cover',
                spotifyId: track.id,
                album: track.album.name
            };
        }
        
        async function fetchLyrics(artist, title) {
            try {
                const cleanArtist = artist.split(' feat')[0].split(' &')[0].trim();
                const cleanTitle = title.replace(/\([^)]*\)/g, '').trim();
                const response = await fetch(`https://api.lyrics.ovh/v1/${encodeURIComponent(cleanArtist)}/${encodeURIComponent(cleanTitle)}`);
                if (response.ok) {
                    const data = await response.json();
                    if (data.lyrics) return data.lyrics;
                }
            } catch(e) { console.warn('Lyrics fetch error'); }
            return null;
        }
        
        function getFallbackLyrics(songName, artist) {
            return `✨ ${songName} - ${artist} ✨\n\nKetik atau tempel lirik di sini.\n\n🎵 What's Your Mood Today? 🎵`;
        }
        
        const screens = {
            1: document.querySelector('.search-form'),
            2: document.querySelector('.search-results'),
            3: document.querySelector('.lyrics-results'),
            4: document.querySelector('.final-options')
        };
        
        function showScreen(num) {
            Object.values(screens).forEach(s => s?.classList.add('hidden'));
            if(screens[num]) screens[num].classList.remove('hidden');
        }
        
        // Tab switching
        document.querySelectorAll('.tab-button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const tabId = btn.dataset.tab;
                document.getElementById('search-tab').classList.toggle('active', tabId === 'search');
                document.getElementById('link-tab').classList.toggle('active', tabId === 'link');
            });
        });
        
        // Handle form search
        document.getElementById('search-form')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const query = document.getElementById('song-name').value.trim();
            if(!query) return;
            
            const statusDiv = document.getElementById('search-status');
            statusDiv.className = 'searching';
            statusDiv.innerHTML = '<span class="loading-spinner"></span> Mencari lagu di Spotify...';
            statusDiv.classList.remove('hidden');
            
            try {
                const results = await searchSpotifyTracks(query);
                statusDiv.classList.add('hidden');
                const container = document.getElementById('song-selection-list');
                container.innerHTML = '';
                
                if(results.length === 0) {
                    container.innerHTML = '<div class="error">❌ Tidak ditemukan di Spotify. Coba kata kunci lain.</div>';
                    showScreen(2);
                    return;
                }
                
                results.forEach(song => {
                    const clone = document.createElement('div');
                    clone.className = 'select-song';
                    clone.innerHTML = `<img src="${song.cover || 'https://placehold.co/200x200?text=No+Cover'}" onerror="this.src='https://placehold.co/200x200?text=No+Cover'"><div><div class="name">${escapeHtml(song.name)}</div><div class="authors">${escapeHtml(song.artist)}</div></div>`;
                    clone.addEventListener('click', async () => {
                        currentSongData = song;
                        const lyricsLoading = document.getElementById('lyrics-loading');
                        const linesContainer = document.getElementById('lines-container');
                        lyricsLoading.classList.remove('hidden');
                        linesContainer.innerHTML = '';
                        showScreen(3);
                        
                        document.getElementById('song-info-mini').querySelector('img').src = song.cover || 'https://placehold.co/200x200?text=No+Cover';
                        document.querySelector('.song-info-name').innerText = song.name;
                        document.querySelector('.song-info-artist').innerText = song.artist;
                        
                        let lyricsText = await fetchLyrics(song.artist, song.name);
                        if(!lyricsText) {
                            lyricsText = getFallbackLyrics(song.name, song.artist);
                        }
                        
                        allLyricsArray = lyricsText.split('\n').filter(l => l.trim().length > 0);
                        linesContainer.innerHTML = '';
                        allLyricsArray.forEach((line, idx) => {
                            const lineDiv = document.createElement('div');
                            lineDiv.className = 'line-item';
                            lineDiv.innerText = line;
                            lineDiv.dataset.index = idx;
                            lineDiv.addEventListener('click', () => { lineDiv.classList.toggle('selected'); });
                            linesContainer.appendChild(lineDiv);
                        });
                        lyricsLoading.classList.add('hidden');
                    });
                    container.appendChild(clone);
                });
                showScreen(2);
            } catch(err) {
                statusDiv.className = 'error';
                statusDiv.innerHTML = `⚠️ Error Spotify: ${err.message}<br>Pastikan Anda sudah mengatur CLIENT_ID Spotify di kode.`;
                console.error(err);
            }
        });
        
        // Handle Spotify link paste
        document.getElementById('link-form')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const link = document.getElementById('spotify-link').value.trim();
            const trackIdMatch = link.match(/track\/([a-zA-Z0-9]+)/);
            if(!trackIdMatch) {
                alert('Link Spotify tidak valid. Pastikan URL track Spotify.');
                return;
            }
            const trackId = trackIdMatch[1];
            const statusDiv = document.getElementById('search-status');
            statusDiv.className = 'searching';
            statusDiv.innerHTML = '<span class="loading-spinner"></span> Memuat dari Spotify...';
            statusDiv.classList.remove('hidden');
            
            try {
                const song = await getSpotifyTrackById(trackId);
                if(!song) throw new Error('Tidak dapat mengambil data track');
                statusDiv.classList.add('hidden');
                currentSongData = song;
                
                // Langsung ke screen 3
                const lyricsLoading = document.getElementById('lyrics-loading');
                const linesContainer = document.getElementById('lines-container');
                lyricsLoading.classList.remove('hidden');
                linesContainer.innerHTML = '';
                showScreen(3);
                
                document.getElementById('song-info-mini').querySelector('img').src = song.cover || 'https://placehold.co/200x200?text=No+Cover';
                document.querySelector('.song-info-name').innerText = song.name;
                document.querySelector('.song-info-artist').innerText = song.artist;
                
                let lyricsText = await fetchLyrics(song.artist, song.name);
                if(!lyricsText) lyricsText = getFallbackLyrics(song.name, song.artist);
                
                allLyricsArray = lyricsText.split('\n').filter(l => l.trim().length > 0);
                linesContainer.innerHTML = '';
                allLyricsArray.forEach((line, idx) => {
                    const lineDiv = document.createElement('div');
                    lineDiv.className = 'line-item';
                    lineDiv.innerText = line;
                    lineDiv.addEventListener('click', () => { lineDiv.classList.toggle('selected'); });
                    linesContainer.appendChild(lineDiv);
                });
                lyricsLoading.classList.add('hidden');
            } catch(err) {
                statusDiv.className = 'error';
                statusDiv.innerHTML = `❌ Gagal load dari Spotify: ${err.message}`;
            }
        });
        
        function escapeHtml(str) { 
            return str.replace(/[&<>]/g, function(m) { 
                if(m === '&') return '&amp;'; 
                if(m === '<') return '&lt;'; 
                if(m === '>') return '&gt;'; 
                return m;
            }); 
        }
        
        function goToFinal() {
            const selected = Array.from(document.querySelectorAll('.line-item.selected')).map(el => el.innerText);
            if(selected.length === 0) { alert("Pilih minimal satu baris lirik."); return; }
            selectedLines = selected;
            document.getElementById('preview-cover').src = currentSongData?.cover || 'https://placehold.co/200x200?text=No+Cover';
            document.getElementById('preview-title').innerText = currentSongData?.name || 'Judul Lagu';
            document.getElementById('preview-artist').innerText = currentSongData?.artist || 'Artis';
            document.getElementById('preview-lyrics').innerHTML = selectedLines.join('<br>');
            showScreen(4);
        }
        
        document.querySelector('.go-to-screen[data-number="4"]')?.addEventListener('click', goToFinal);
        document.getElementById('lyrics-fab')?.addEventListener('click', goToFinal);
        document.querySelectorAll('.go-to-screen').forEach(btn => {
            btn.addEventListener('click', () => {
                const num = parseInt(btn.getAttribute('data-number'));
                if(!isNaN(num)) showScreen(num);
            });
        });
        document.getElementById('last-go-back')?.addEventListener('click', () => showScreen(3));
        
        document.getElementById('download')?.addEventListener('click', () => {
            const previewDiv = document.getElementById('song-image-preview');
            const originalWidth = previewDiv.style.width;
            const widthVal = document.getElementById('width-slider').value;
            previewDiv.style.width = widthVal + 'px';
            
            let bgColor = '#f8f8f8';
            const bgSwitch = document.getElementById('additional-bg');
            if(bgSwitch.classList.contains('active')) bgColor = '#ffffff';
            previewDiv.style.backgroundColor = bgColor;
            
            const lightTextSwitch = document.getElementById('light-text');
            if(lightTextSwitch.classList.contains('active')) {
                previewDiv.style.color = '#1a1a1a';
            } else {
                previewDiv.style.color = '#ffffff';
            }
            
            const spotifyTagSwitch = document.getElementById('spotify-tag');
            const spotifyElem = document.getElementById('spotify-tag-img');
            if(spotifyTagSwitch.classList.contains('active')) spotifyElem.style.display = 'flex';
            else spotifyElem.style.display = 'none';
            
            html2canvas(previewDiv, { scale: 2, backgroundColor: bgColor, useCORS: true, logging: false }).then(canvas => {
                canvas.toBlob(blob => { saveAs(blob, `chosong_${currentSongData?.name || 'image'}.png`); });
                previewDiv.style.width = originalWidth;
            }).catch(() => { alert("Gagal generate"); previewDiv.style.width = originalWidth; });
        });
        
        const slider = document.getElementById('width-slider');
        const widthValSpan = document.getElementById('width-value');
        slider.addEventListener('input', () => {
            const val = slider.value;
            widthValSpan.innerText = val + 'px';
            document.getElementById('song-image-preview').style.width = val + 'px';
        });
        
        function initSwitch(containerId, onToggle) {
            const cont = document.getElementById(containerId);
            if(!cont) return;
            cont.addEventListener('click', () => {
                cont.classList.toggle('active');
                if(onToggle) onToggle(cont.classList.contains('active'));
            });
        }
        
        initSwitch('light-text', (active) => {
            const preview = document.getElementById('song-image-preview');
            if(active) preview.style.color = '#1a1a1a';
            else preview.style.color = '#ffffff';
        });
        
        initSwitch('additional-bg', (active) => {
            const preview = document.getElementById('song-image-preview');
            if(active) preview.style.backgroundColor = '#ffffff';
            else preview.style.backgroundColor = '#f8f8f8';
        });
        
        initSwitch('spotify-tag', (active) => {
            const tag = document.getElementById('spotify-tag-img');
            if(active) tag.style.display = 'flex';
            else tag.style.display = 'none';
        });
        
        const colorPicker = document.getElementById('custom-color-input');
        colorPicker.addEventListener('input', (e) => {
            document.getElementById('song-image-preview').style.color = e.target.value;
        });
        
        // Inisialisasi default
        document.getElementById('spotify-tag').classList.add('active');
        document.getElementById('spotify-tag-img').style.display = 'flex';
        document.getElementById('additional-bg').classList.remove('active');
        document.getElementById('light-text').classList.add('active');
        document.getElementById('song-image-preview').style.backgroundColor = '#f8f8f8';
        document.getElementById('song-image-preview').style.color = '#1a1a1a';
        
        showScreen(1);
    </script>

    3. Pada bagian Redirect URIs, masukkan: http://localhost:5500/callback.html (untuk testing lokal)
       Atau jika deploy, masukkan URL lengkap Anda, contoh: https://username.github.io/repo/callback.html
    4. Simpan, lalu copy Client ID
    5. Pada kode di atas, ganti 'YOUR_SPOTIFY_CLIENT_ID' dengan Client ID tersebut
    6. Buat file kosong bernama 'callback.html' di folder yang sama (isi minimal: <script>window.close()</script>)
    7. Jalankan aplikasi, fitur pencarian Spotify dan paste link akan berfungsi!
    
    CATATAN: Untuk production, aplikasi harus dijalankan di HTTPS (GitHub Pages, Vercel, dll)
    -->
</body>
